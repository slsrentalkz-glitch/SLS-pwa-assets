<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>SLS</title>

  <meta name="application-name" content="SLS">
  <meta name="apple-mobile-web-app-title" content="SLS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080809">

  <link rel="apple-touch-icon" sizes="180x180" href="./sls-icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./sls-icon-192.png">
  <link rel="manifest" href="./manifest.webmanifest">

  <style>
    html,
    body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#080809;
    }

    body {
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
    }

    #splash {
      position:fixed;
      inset:0;
      z-index:2;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      gap:18px;
      background:
        radial-gradient(
          circle at 50% 30%,
          rgba(201,168,106,.16),
          transparent 36%
        ),
        #080809;
      color:#e8d2a1;
      transition:
        opacity .28s ease,
        visibility .28s ease;
    }

    #splash.hidden {
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .logo {
      width:min(42vw, 180px);
      aspect-ratio:1;
      object-fit:cover;
      border-radius:26%;
      box-shadow:
        0 24px 70px rgba(0,0,0,.46),
        0 0 38px rgba(201,168,106,.10);
    }

    .brand {
      text-align:center;
    }

    .brand-main {
      font-size:24px;
      font-weight:900;
      letter-spacing:8px;
      padding-left:8px;
    }

    .brand-sub {
      margin-top:8px;
      font-size:9px;
      font-weight:700;
      letter-spacing:3px;
      color:#a98d5a;
    }

    .made {
      margin-top:5px;
      font-size:8px;
      letter-spacing:2px;
      color:#77736b;
    }

    .loader {
      width:34px;
      height:34px;
      margin-top:6px;
      border-radius:50%;
      border:2px solid rgba(201,168,106,.18);
      border-top-color:#d5b36f;
      animation:spin .8s linear infinite;
    }

    @keyframes spin {
      to { transform:rotate(360deg); }
    }

    #appFrame {
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      border:0;
      background:#080809;
    }

    @supports (height: 100dvh) {
      #appFrame {
        height:100dvh;
      }
    }
  </style>
</head>

<body>

  <div id="splash">
    <img
      class="logo"
      src="./sls-icon-512.png"
      alt="SLS"
    >

    <div class="brand">
      <div class="brand-main">SLS</div>
      <div class="brand-sub">WORK SYSTEM</div>
      <div class="made">CRAFTED BY MATUA</div>
    </div>

    <div class="loader"></div>
  </div>

  <iframe
    id="appFrame"
    src="about:blank"
    allow="clipboard-read; clipboard-write"
    referrerpolicy="no-referrer-when-downgrade"
  ></iframe>

  <script>
    const frame =
      document.getElementById('appFrame');

    const APP_URL =
      'https://script.google.com/macros/s/AKfycbzpM52b7oy1dqKWaTiSPB8iHgpzBG9pa30m8KlZrXpllLYnbCs6tuGqE6srlJljamJq/exec';

    function loadFreshSls() {
      frame.src =
        APP_URL +
        '?sls_version=35_2&ts=' +
        Date.now();
    }

    loadFreshSls();

    const splash =
      document.getElementById('splash');

    function hideSplash() {
      splash.classList.add('hidden');
    }

    frame.addEventListener(
      'load',
      () => {
        setTimeout(
          hideSplash,
          450
        );
      }
    );

    /*
     * Страховка на случай, если iframe уже загрузился,
     * но мобильный браузер не прислал load вовремя.
     */
    setTimeout(
      hideSplash,
      6500
    );

    let hiddenAt = 0;

    document.addEventListener(
      'visibilitychange',
      () => {
        if (document.visibilityState === 'hidden') {
          hiddenAt = Date.now();
          return;
        }

        if (
          hiddenAt &&
          Date.now() - hiddenAt > 15000
        ) {
          loadFreshSls();
        }
      }
    );

  </script>

</body>
</html>
