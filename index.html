<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>SLS</title>

  <meta name="application-name" content="SLS">
  <meta name="apple-mobile-web-app-title" content="SLS">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#080809">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="./sls-icon-180.png"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="./sls-icon-192.png"
  >

  <link
    rel="manifest"
    href="./manifest.webmanifest"
  >

  <style>
    html,
    body {
      width:100%;
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      background:#080809;
    }

    body {
      display:flex;
      align-items:center;
      justify-content:center;
      padding:
        env(safe-area-inset-top)
        env(safe-area-inset-right)
        env(safe-area-inset-bottom)
        env(safe-area-inset-left);
      box-sizing:border-box;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Arial,
        sans-serif;
      color:#e8d2a1;
    }

    .launcher {
      width:min(86vw, 360px);
      text-align:center;
    }

    .logo {
      width:min(42vw, 170px);
      aspect-ratio:1;
      object-fit:cover;
      border-radius:26%;
      box-shadow:
        0 24px 70px rgba(0,0,0,.46),
        0 0 38px rgba(201,168,106,.10);
    }

    .brand-main {
      margin-top:18px;
      padding-left:8px;
      font-size:24px;
      font-weight:900;
      letter-spacing:8px;
    }

    .brand-sub {
      margin-top:8px;
      color:#a98d5a;
      font-size:9px;
      font-weight:800;
      letter-spacing:3px;
    }

    .made {
      margin-top:5px;
      color:#77736b;
      font-size:8px;
      letter-spacing:2px;
    }

    .loader {
      width:34px;
      height:34px;
      margin:22px auto 0;
      border-radius:50%;
      border:2px solid rgba(201,168,106,.18);
      border-top-color:#d5b36f;
      animation:spin .8s linear infinite;
    }

    .status {
      margin-top:14px;
      color:#8f8b82;
      font-size:9px;
      line-height:1.45;
    }

    .open-button {
      width:100%;
      min-height:44px;
      margin-top:18px;
      display:none;
      align-items:center;
      justify-content:center;
      border-radius:14px;
      border:1px solid rgba(201,168,106,.25);
      background:rgba(201,168,106,.10);
      color:#e4c987;
      font-size:10px;
      font-weight:900;
      letter-spacing:.5px;
      cursor:pointer;
    }

    .open-button.show {
      display:flex;
    }

    @keyframes spin {
      to {
        transform:rotate(360deg);
      }
    }
  </style>
</head>

<body>

  <main class="launcher">

    <img
      class="logo"
      src="./sls-icon-512.png"
      alt="SLS"
    >

    <div class="brand-main">
      SLS
    </div>

    <div class="brand-sub">
      WORK SYSTEM
    </div>

    <div class="made">
      CRAFTED BY MATUA · v35.4
    </div>

    <div class="loader"></div>

    <div
      id="status"
      class="status"
    >
      Открываем рабочую систему...
    </div>

    <button
      id="openButton"
      class="open-button"
      type="button"
      onclick="openSlsDirect()"
    >
      ОТКРЫТЬ SLS WORKS
    </button>

  </main>


  <script>
    const APP_URL =
      'https://script.google.com/macros/s/AKfycbzpM52b7oy1dqKWaTiSPB8iHgpzBG9pa30m8KlZrXpllLYnbCs6tuGqE6srlJljamJq/exec';

    const LAUNCHER_VERSION =
      '35.4';


    function buildDirectUrl() {

      const separator =
        APP_URL.includes('?')
          ? '&'
          : '?';


      return (
        APP_URL +
        separator +
        'sls_version=' +
        encodeURIComponent(
          LAUNCHER_VERSION
        ) +
        '&ts=' +
        Date.now()
      );
    }


    function openSlsDirect() {

      /*
       * КЛЮЧЕВОЕ ИЗМЕНЕНИЕ v35.4:
       * Apps Script открывается как верхняя страница,
       * а не внутри iframe.
       *
       * Это устраняет проблему Яндекс.Браузера /
       * Google preview / Google Drive redirect.
       */
      window.location.replace(
        buildDirectUrl()
      );
    }


    async function checkLauncherVersion() {

      try {

        const response =
          await fetch(
            './version.json?ts=' +
            Date.now(),
            {
              cache:'no-store'
            }
          );


        if (!response.ok) {
          return true;
        }


        const data =
          await response.json();


        const serverVersion =
          String(
            data.version || ''
          );


        const params =
          new URLSearchParams(
            window.location.search
          );


        const urlVersion =
          params.get('v') || '';


        if (
          serverVersion &&
          serverVersion !==
            urlVersion
        ) {

          window.location.replace(
            window.location.pathname +
            '?v=' +
            encodeURIComponent(
              serverVersion
            ) +
            '&ts=' +
            Date.now()
          );


          return false;
        }

      } catch (error) {

        console.warn(
          'Version check failed',
          error
        );
      }


      return true;
    }


    async function startLauncher() {

      const ready =
        await checkLauncherVersion();


      if (!ready) {
        return;
      }


      /*
       * Небольшая задержка нужна только чтобы пользователь
       * увидел фирменную заставку, после чего открываем Apps Script.
       */
      setTimeout(
        openSlsDirect,
        450
      );


      /*
       * Если браузер заблокировал автоматический переход,
       * появляется обычная кнопка.
       */
      setTimeout(
        () => {

          document
            .getElementById(
              'status'
            )
            .textContent =
              'Если SLS WORKS не открылся автоматически — нажмите кнопку ниже.';


          document
            .getElementById(
              'openButton'
            )
            .classList.add(
              'show'
            );

        },
        3200
      );
    }


    startLauncher();
  </script>

</body>
</html>
