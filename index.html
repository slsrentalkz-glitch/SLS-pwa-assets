<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover"><title>SLS</title><meta name="application-name" content="SLS"><meta name="apple-mobile-web-app-title" content="SLS"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black"><meta name="theme-color" content="#080809"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><link rel="apple-touch-icon" sizes="180x180" href="./sls-icon-180.png"><link rel="icon" type="image/png" sizes="192x192" href="./sls-icon-192.png"><link rel="manifest" href="./manifest.webmanifest"><style>*{box-sizing:border-box}html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;padding:0;overflow:hidden;background:#080809;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);background:radial-gradient(circle at 50% 30%,rgba(201,168,106,.16),transparent 36%),#080809;color:#e8d2a1;transition:opacity .28s ease,visibility .28s ease}#splash.hidden{opacity:0;visibility:hidden;pointer-events:none}.logo{width:min(42vw,180px);aspect-ratio:1;object-fit:cover;border-radius:26%}.brand-main{padding-left:8px;text-align:center;font-size:24px;font-weight:900;letter-spacing:8px}.brand-sub{margin-top:8px;text-align:center;font-size:9px;font-weight:700;letter-spacing:3px;color:#a98d5a}.made{margin-top:5px;text-align:center;font-size:8px;letter-spacing:2px;color:#77736b}.loader{width:34px;height:34px;margin-top:6px;border-radius:50%;border:2px solid rgba(201,168,106,.18);border-top-color:#d5b36f;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}#appFrame{position:fixed;left:0;right:0;top:env(safe-area-inset-top);bottom:env(safe-area-inset-bottom);display:block;width:100%;height:auto;max-width:100%;border:0;margin:0;padding:0;background:#080809}</style></head><body><div id="splash"><img class="logo" src="./sls-icon-512.png" alt="SLS"><div><div class="brand-main">SLS</div><div class="brand-sub">WORK SYSTEM</div><div class="made">CRAFTED BY MATUA</div></div><div class="loader"></div></div><iframe id="appFrame" src="about:blank" allow="clipboard-read; clipboard-write" referrerpolicy="no-referrer-when-downgrade"></iframe><script>const APP_URL='https://script.google.com/macros/s/AKfycbzpM52b7oy1dqKWaTiSPB8iHgpzBG9pa30m8KlZrXpllLYnbCs6tuGqE6srlJljamJq/exec';const APP_VERSION='43.2-simple-shell';const frame=document.getElementById('appFrame');const splash=document.getElementById('splash');function loadFreshSls(){const sep=APP_URL.includes('?')?'&':'?';frame.src=APP_URL+sep+'sls_version='+encodeURIComponent(APP_VERSION)+'&ts='+Date.now()}function hideSplash(){splash.classList.add('hidden')}frame.addEventListener('load',()=>{setTimeout(hideSplash,420)});loadFreshSls();let hiddenAt=0;document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'){hiddenAt=Date.now();return}if(hiddenAt&&Date.now()-hiddenAt>30000)loadFreshSls()});setTimeout(hideSplash,6500)</script></body></html>
